<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download SoundEngg Console | Windows, iOS & Android</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
    <style>
        body {
            background-color: #07080c;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 24px;
            box-sizing: border-box;
            background-image: radial-gradient(circle at 50% 20%, rgba(0, 242, 254, 0.08) 0%, transparent 60%);
        }
        .download-card {
            background: rgba(16, 20, 30, 0.85);
            border: 1px solid rgba(0, 242, 254, 0.25);
            backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 36px 28px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(0, 242, 254, 0.1);
        }
        .logo-badge {
            width: 68px;
            height: 68px;
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 8px 24px rgba(0, 242, 254, 0.35);
        }
        .logo-badge span {
            font-size: 38px;
            color: #050508;
            font-weight: bold;
        }
        h1 {
            font-size: 1.6rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #fff;
        }
        p.subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin: 0 0 28px 0;
            line-height: 1.5;
        }
        .platform-detected {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }
        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 14px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .dl-btn-primary {
            background: linear-gradient(135deg, #00f2fe, #4facfe);
            color: #050508;
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.3);
        }
        .dl-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 242, 254, 0.45);
        }
        .dl-btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .dl-btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(0, 242, 254, 0.5);
            transform: translateY(-2px);
        }
        .footer-links {
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 18px;
            display: flex;
            justify-content: center;
            gap: 16px;
        }
        .footer-links a {
            color: #94a3b8;
            text-decoration: none;
            transition: color 0.2s;
        }
        .footer-links a:hover {
            color: #00f2fe;
        }
    </style>
</head>
<body>
    <div class="download-card">
        <div class="logo-badge">
            <span class="material-symbols-outlined">graphic_eq</span>
        </div>
        <h1>SoundEngg Studio Console</h1>
        <p class="subtitle">The Offline Pro Audio Suite for Touring Engineers, System Techs & FOH Crews.</p>

        <div id="detected-badge" class="platform-detected">
            <span class="material-symbols-outlined" style="font-size: 16px;">laptop_windows</span>
            <span id="detected-text">Detecting System...</span>
        </div>

        <div class="btn-group" id="download-actions">
            <!-- Dynamic buttons rendered via JS based on OS -->
            <a href="releases/SoundEngg-Setup.exe" class="dl-btn dl-btn-primary" id="btn-win-setup">
                <span class="material-symbols-outlined">download</span> Download for Windows (.exe)
            </a>
            <a href="releases/SoundEngg-Portable.exe" class="dl-btn dl-btn-secondary" id="btn-win-portable">
                <span class="material-symbols-outlined">usb</span> Portable Edition (No Install)
            </a>
        </div>

        <div class="footer-links">
            <a href="https://apps.apple.com/us/app/soundengg/id6783749210" target="_blank">iOS App</a>
            <span>•</span>
            <a href="https://play.google.com/store/apps/details?id=com.soundengg.app" target="_blank">Android App</a>
            <span>•</span>
            <a href="app.html">Web App</a>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', function() {
            var ua = navigator.userAgent || '';
            var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
            var isAndroid = /Android/.test(ua);
            var isWindows = /Windows|Win32|Win64|WOW64/.test(ua) || navigator.platform.indexOf('Win') !== -1;

            var badge = document.getElementById('detected-badge');
            var text = document.getElementById('detected-text');
            var actions = document.getElementById('download-actions');

            var isMac = /Macintosh|MacIntel|MacPPC|Mac68K/.test(ua) && !isIOS;

            if (isIOS) {
                text.textContent = 'Apple iOS Detected';
                badge.querySelector('span').textContent = 'phone_iphone';
                actions.innerHTML = `
                    <a href="https://apps.apple.com/us/app/soundengg/id6783749210" class="dl-btn dl-btn-primary">
                        <span class="material-symbols-outlined">arrow_forward</span> Download on the App Store
                    </a>
                    <a href="app.html" class="dl-btn dl-btn-secondary">
                        <span class="material-symbols-outlined">open_in_browser</span> Launch Web Version
                    </a>
                `;
                // Seamless redirect to App Store
                setTimeout(function() {
                    window.location.replace('https://apps.apple.com/us/app/soundengg/id6783749210');
                }, 1200);
            } else if (isAndroid) {
                text.textContent = 'Android OS Detected';
                badge.querySelector('span').textContent = 'android';
                actions.innerHTML = `
                    <a href="https://play.google.com/store/apps/details?id=com.soundengg.app" class="dl-btn dl-btn-primary">
                        <span class="material-symbols-outlined">arrow_forward</span> Get it on Google Play
                    </a>
                    <a href="app.html" class="dl-btn dl-btn-secondary">
                        <span class="material-symbols-outlined">open_in_browser</span> Launch Web Version
                    </a>
                `;
                // Seamless redirect to Google Play
                setTimeout(function() {
                    window.location.replace('https://play.google.com/store/apps/details?id=com.soundengg.app');
                }, 1200);
            } else if (isWindows) {
                text.textContent = 'Windows Laptop Detected';
                badge.querySelector('span').textContent = 'laptop_windows';
                actions.innerHTML = `
                    <a href="/download/windows" class="dl-btn dl-btn-primary">
                        <span class="material-symbols-outlined">download</span> Download Windows Installer (.exe)
                    </a>
                    <a href="/download/windows-portable" class="dl-btn dl-btn-secondary">
                        <span class="material-symbols-outlined">usb</span> Download Portable (.exe)
                    </a>
                `;
            } else if (isMac) {
                text.textContent = 'Apple Mac Detected';
                badge.querySelector('span').textContent = 'laptop_mac';
                actions.innerHTML = `
                    <a href="/download/mac" class="dl-btn dl-btn-primary">
                        <span class="material-symbols-outlined">download</span> Download for Mac (.dmg)
                    </a>
                    <a href="app.html" class="dl-btn dl-btn-secondary">
                        <span class="material-symbols-outlined">open_in_browser</span> Launch Web Console
                    </a>
                `;
            } else {
                text.textContent = 'Desktop Detected';
                badge.querySelector('span').textContent = 'desktop_windows';
                actions.innerHTML = `
                    <a href="/download/windows" class="dl-btn dl-btn-primary">
                        <span class="material-symbols-outlined">download</span> Download Windows (.exe)
                    </a>
                    <a href="/download/mac" class="dl-btn dl-btn-secondary">
                        <span class="material-symbols-outlined">download</span> Download Mac (.dmg)
                    </a>
                `;
            }
        });
    </script>
</body>
</html>
