<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting to SoundEngg App Store...</title>
    <style>
        body {
            background-color: #0a0a0f;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
        }
        .spinner {
            border: 4px solid rgba(0, 255, 255, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #00ffff;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        window.onload = function() {
            var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            var isAndroid = /Android/.test(navigator.userAgent);
            
            if (isIOS) {
                window.location.replace('https://apps.apple.com/us/app/soundengg/id6783749210');
            } else if (isAndroid) {
                // Try both possible package names or the verified one com.soundengg.app
                window.location.replace('https://play.google.com/store/apps/details?id=com.soundengg.app');
            } else {
                // If on desktop, redirect to the main landing page
                window.location.replace('index.html');
            }
        };
    </script>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <p>Connecting to App Store...</p>
    </div>
</body>
</html>
